[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_court"
version = "0.1.0"
description = "AI Court - Legal Case Analysis and Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "AI Court Team", email = "dev@aicourt.com"}
]
dependencies = [
    "Flask>=2.2",
    "flask-cors>=3.0",
    "dill>=0.3",
    "numpy>=1.21",
    "pydantic>=2.7",
    "pandas>=1.3",
    "pyarrow>=14.0",
    "scikit-learn>=1.2",
    "nltk>=3.8",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "transformers>=4.39",
    "sentence-transformers>=2.2",
    "torch>=2.1",
    "accelerate>=0.26.0",
    "python-dotenv>=1.0",
    "flasgger>=0.9.7.1",
    "Flask-Limiter>=3.8",
    "prometheus-client>=0.20",
    "sentry-sdk[flask]>=2.13",
    "pyyaml>=6.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "mlflow>=2.14"
]

[project.optional-dependencies]
# Keep these in lockstep with requirements-dev.txt, which pins the exact
# versions CI installs (ruff's default rule set is version-sensitive).
dev = [
    "pytest>=7.4",
    "ruff==0.16.3",
    "mypy==2.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
# scripts/ holds one-off operational and research utilities (dataset harvest,
# report figures, manual verification) that are not part of the shipped package
# or the Docker image. They are still syntax-checked by the CI py_compile step.
extend-exclude = ["scripts"]

[tool.ruff.lint]
# No `select` override: we deliberately track ruff's curated default rule set.
# That set is a moving target across minor releases, so requirements-dev.txt
# pins an exact ruff version (see the note there). Bumping that pin is the
# supported way to adopt new rules, as a reviewed change rather than a silent
# CI break. Enabling whole families beyond the default (S, PL, TRY, ...) would
# add ~1600 findings that are unrelated to correctness here.
ignore = [
    # Blind `except Exception` is the deliberate fail-soft boundary around every
    # optional subsystem (search index, semantic index, multi-axis model, Redis
    # cache, OCR, MLflow). The service must still boot and serve when those
    # artifacts are absent - that is exactly how it runs on Render's free tier
    # and in the CI docker smoke (DISABLE_SEARCH_INDEX / LOW_MEMORY). Narrowing
    # these to concrete exception tuples would turn optional-feature degradation
    # into hard 500s, so the broad catch is intentional, not an oversight.
    "BLE001",
    # Same boundaries, seen from the other side: a few of those handlers have
    # nothing useful to do (best-effort stats dumps, optional cache warmers) and
    # intentionally swallow. Handlers that *can* act do log - see the many
    # logger.warning/​logger.exception calls alongside them.
    "S110",  # try-except-pass
    "S112",  # try-except-continue
]

[tool.ruff.lint.per-file-ignores]
# preprocessor.py calls ensure_nltk_resources() between stdlib and nltk imports
# to guarantee NLTK data is downloaded before corpus readers bind their paths.
"src/ai_court/model/preprocessor.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Only collect the real test suite under tests/. scripts/test_*.py are manual
# operational/integration utilities (not unit tests) that import the live server
# and perform side effects; collecting them as part of the suite breaks CI.
testpaths = ["tests"]
